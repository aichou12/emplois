<VirtualHost *:80>
    ServerName emploi.fpublique.sn
    ServerAlias emploi.fonctionpublique.sn www.emploi.fonctionpublique.sn www.emploi.fpublique.sn 10.128.12.71 10.42.3.71 *
    DocumentRoot /var/www/emplois/public

    <Directory /var/www/emplois/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/emplois_error.log
    CustomLog ${APACHE_LOG_DIR}/emplois_access.log combined
</VirtualHost>
